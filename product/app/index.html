<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Launchpad</title>
<style>
  :root {
    --bg:#F2F4F6; --surface:#fff; --surface2:#E9EDF1; --ink:#1B2530; --muted:#5C6B78;
    --line:#D7DEE4; --accent:#D14E12; --accent-ink:#fff; --accent-soft:#F8E4D8;
    --ok:#237A50; --ok-soft:#DCEFE4; --warn:#96690F; --warn-soft:#F4E8CC; --bad:#B3362B; --bad-soft:#F5DDDA;
    --shadow:0 1px 3px rgba(27,37,48,.07);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0F141A; --surface:#171E26; --surface2:#212B36; --ink:#E6EBEF; --muted:#94A3B0;
    --line:#2B3642; --accent:#F07A3D; --accent-ink:#1F0E04; --accent-soft:#3A2517;
    --ok:#5CBA88; --ok-soft:#1C3427; --warn:#D9A93F; --warn-soft:#362F19; --bad:#E0685C; --bad-soft:#3B211E;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0F141A; --surface:#171E26; --surface2:#212B36; --ink:#E6EBEF; --muted:#94A3B0;
    --line:#2B3642; --accent:#F07A3D; --accent-ink:#1F0E04; --accent-soft:#3A2517;
    --ok:#5CBA88; --ok-soft:#1C3427; --warn:#D9A93F; --warn-soft:#362F19; --bad:#E0685C; --bad-soft:#3B211E;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Segoe UI',system-ui,-apple-system,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px}
  code{font-family:Consolas,'SF Mono',monospace;font-size:.88em;background:var(--surface2);padding:1px 5px;border-radius:4px}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  h1{font-size:26px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em}
  h2{font-size:20px;font-weight:700;margin:0}
  .go{background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:8px;font-weight:700}
  .go:hover{filter:brightness(1.08)}
  .go[disabled]{opacity:.45;cursor:not-allowed;filter:none}
  .ghost{border:1px solid var(--line);padding:9px 16px;border-radius:8px;font-weight:600;background:var(--surface)}
  .ghost:hover{background:var(--surface2)}
  .eyebrow{font-family:Consolas,monospace;font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;font-weight:700}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
  .head-in{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:16px 0 0;flex-wrap:wrap}
  nav{display:flex;gap:4px}
  nav button{padding:10px 13px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
  .topbar{display:flex;align-items:center;gap:11px;padding:11px 0 12px;flex-wrap:wrap}
  .tb-lbl{font-family:Consolas,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .bar{flex:1 1 200px;min-width:140px;height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .45s cubic-bezier(.4,0,.2,1)}
  .tb-pct{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
  .tb-sub{flex-basis:100%;font-size:12.5px;color:var(--muted);margin-top:-4px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
  .chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
  .chip.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
  .chip.dim{color:var(--muted)}
  main{padding:10px 0 60px}
  .view{display:none}.view.on{display:block}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .hint{color:var(--muted);font-size:13px;margin:6px 0 10px}
  label.fld{display:block;margin:14px 0 6px;font-weight:600;font-size:13.5px}
  textarea,input[type=text],select{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
  textarea{min-height:150px;resize:vertical;font-family:Consolas,monospace;font-size:12.5px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:6px}
  .opt-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 13px;text-align:left;font-weight:600}
  .opt-btn:hover{background:var(--surface2)}
  .opt-btn.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .opt-btn small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
  .steps-dots{display:flex;gap:6px;align-items:center;margin:0 0 12px}
  .dot{width:26px;height:4px;border-radius:2px;background:var(--surface2)}
  .dot.on{background:var(--accent)}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--muted);cursor:pointer}
  .drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .sig{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .phase{margin-top:24px}
  .phase-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .phase-code{font-family:Consolas,monospace;font-weight:700;font-size:12px;color:var(--accent);letter-spacing:.08em}
  .phase-name{font-weight:700;font-size:16.5px}
  .wk{background:var(--surface);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;box-shadow:var(--shadow)}
  .wk-row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px;border-radius:9px}
  .wk-row:hover{background:var(--surface2)}
  .wk-code{font-family:Consolas,monospace;font-size:12px;font-weight:700;color:var(--muted)}
  .wk-title{font-weight:600}
  .wk-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.doing{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
  .pill.done{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
  .back{font-weight:600;color:var(--muted);padding:8px 0;margin-top:6px}
  .back:hover{color:var(--ink)}
  .wkpage-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:6px 0 4px}
  .focusline{font-size:14px;margin:8px 0;color:var(--muted)}
  .focusline b{color:var(--ink)}
  .stepbar{display:flex;align-items:center;gap:11px;margin:14px 0 10px;flex-wrap:wrap}
  .stepbar .bar{height:8px}.stepbar .lbl{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .step{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:7px}
  .step.done{opacity:.62}
  .step.done .st-t{text-decoration:line-through}
  .step input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
  .st-t{font-weight:600}
  .st-d{font-size:13px;color:var(--muted);margin-top:3px}
  .linkchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .linkchips a{font-size:11.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .linkchips a:hover{background:var(--accent-soft)}
  .takequiz{margin-top:9px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .qbox{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:15px;margin-bottom:10px}
  .qsec{font-family:Consolas,monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .qtext{font-weight:600;margin:6px 0 10px}
  .qn{font-family:Consolas,monospace;color:var(--muted);margin-right:8px}
  .optn{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
  .optn:hover{background:var(--surface2)}
  .optn input{margin-top:3px;accent-color:var(--accent)}
  .graded .optn{cursor:default}
  .optn.right{border-color:var(--ok);background:var(--ok-soft)}
  .optn.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .expl{font-size:13px;color:var(--muted);margin-top:6px}
  .expl:empty{display:none}
  .result{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:18px;margin-bottom:14px}
  .result .big{font-size:34px;font-weight:800}
  .secline{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px;box-shadow:var(--shadow)}
  .tile .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .tile .val{font-size:27px;font-weight:800;margin:3px 0}
  .tile .val small{font-size:14px;color:var(--muted);font-weight:600}
  .now{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:16px 0 4px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;box-shadow:var(--shadow)}
  .now .tag{font-family:Consolas,monospace;font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--accent)}
  .now span{color:var(--muted)}
  .banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:9px;padding:12px 14px;margin:12px 0;font-size:13.5px}
  .prow{display:flex;align-items:center;gap:10px;padding:7px 2px}
  .prow .pn{font-size:13.5px;min-width:120px}
  .prow .pct{font-family:Consolas,monospace;font-size:11.5px;color:var(--muted);min-width:36px;text-align:right}
  footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:16px 0 30px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap head-in">
    <div><div class="eyebrow">Interview Launchpad</div><h1 id="hdr-title">Your adaptive prep plan</h1></div>
    <nav id="nav" hidden>
      <button data-v="roadmap" class="on">Roadmap</button>
      <button data-v="quizzes">Quizzes</button>
      <button data-v="progress">Progress</button>
    </nav>
  </div>
  <div class="wrap topbar" id="topbar" hidden>
    <span class="tb-lbl">Progress</span>
    <span class="bar" id="tb-bar" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="tb-fill" style="width:0"></i></span>
    <span class="tb-pct" id="tb-pct">0%</span>
    <span class="chip dim" id="savechip">…</span>
    <span class="tb-sub" id="tb-sub"></span>
  </div>
</header>

<main class="wrap">
  <div id="storage-warn"></div>
  <section class="view on" id="view-setup"></section>
  <div class="now" id="now" hidden></div>
  <section class="view" id="view-roadmap"></section>
  <section class="view" id="view-quizzes"></section>
  <section class="view" id="view-progress"></section>
</main>

<footer><div class="wrap" id="foot">Everything runs in your browser — your resume never leaves this device.</div></footer>

<script>
"use strict";
/* =====================================================================
   Interview Launchpad — single-file, offline, zero-dependency.
   Nothing is uploaded anywhere: parsing, planning and progress are all
   local to this browser. See README for the licence.
   ===================================================================== */

/* ---------------- roles ---------------- */
const ROLES = {
  backend:   { n:"Backend Engineer",  blurb:"APIs, databases, scale, system design",         secs:["Python","SQL","DSA","Web","Java"] },
  ai:        { n:"AI Engineer",       blurb:"LLM apps, RAG, agents, evals",                   secs:["Python","ML/AI","Web","DSA"] },
  ml:        { n:"ML Engineer",       blurb:"Models, features, training, serving",            secs:["Python","ML/AI","Stats","SQL"] },
  data:      { n:"Data Analyst",      blurb:"SQL, statistics, dashboards, storytelling",      secs:["SQL","Stats","Python","ML/AI"] },
  fullstack: { n:"Full-Stack Engineer",blurb:"Frontend + backend + deployment",               secs:["Python","Web","SQL","DSA"] }
};

/* ---------------- topic pool (shared across roles) ----------------
   tr = track, used to braid each week so no week is single-subject.
   h  = study hours. sec = diagnostic section that gates priority.
   sk = resume skill key: if the résumé proves it AND the diagnostic
        section is strong, the topic is compressed to a verify pass.   */
const T = {
  "py-core":   {n:"Python core: collections, comprehensions, sorting, big-O of builtins", tr:"lang", h:3, sec:"Python", sk:"python", lk:[["Data structures",   "https://docs.python.org/3/tutorial/datastructures.html"],["Sorting HOWTO","https://docs.python.org/3/howto/sorting.html"],["Time complexity","https://wiki.python.org/moin/TimeComplexity"]]},
  "py-adv":    {n:"Closures, decorators, generators, typing, error design",               tr:"lang", h:3, sec:"Python", sk:"python", lk:[["Functional HOWTO","https://docs.python.org/3/howto/functional.html"],["typing","https://docs.python.org/3/library/typing.html"]]},
  "py-test":   {n:"Testing: pytest patterns, fixtures, coverage, what to assert",          tr:"craft",h:2, sec:"Python", sk:"pytest",lk:[["pytest docs","https://docs.pytest.org/"]]},
  "js-core":   {n:"JavaScript core: closures, async/await, event loop, modules",           tr:"lang", h:3, sec:"Web",    sk:"javascript", lk:[["MDN JS guide","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide"]]},
  "react":     {n:"React: components, hooks, state, rendering behaviour",                  tr:"lang", h:3, sec:"Web",    sk:"react", lk:[["React docs","https://react.dev/learn"]]},
  "java-core": {n:"Java core: collections internals, generics, equals/hashCode, Streams",  tr:"lang", h:3, sec:"Java",   sk:"java", lk:[["Java tutorials","https://dev.java/learn/"]]},
  "java-conc": {n:"Java concurrency + JVM memory & GC",                                    tr:"lang", h:3, sec:"Java",   sk:"java", lk:[["Concurrency","https://docs.oracle.com/javase/tutorial/essential/concurrency/"]]},
  "spring":    {n:"Spring: IoC/DI, @Transactional, JPA/Hibernate, Boot auto-config",        tr:"sys",  h:3, sec:"Java",   sk:"spring", lk:[["Spring Boot","https://spring.io/projects/spring-boot"]]},
  "sql-join":  {n:"SQL: joins mastery, aggregation, GROUP BY semantics",                    tr:"data", h:2, sec:"SQL",    sk:"sql", lk:[["SQL joins","https://www.postgresql.org/docs/current/tutorial-join.html"]]},
  "sql-cte":   {n:"SQL: subqueries, CTEs, set operations",                                  tr:"data", h:2, sec:"SQL",    sk:"sql", lk:[["WITH queries","https://www.postgresql.org/docs/current/queries-with.html"]]},
  "sql-win":   {n:"SQL: window functions (the interview favourite)",                        tr:"data", h:3, sec:"SQL",    sk:"sql", lk:[["Window functions","https://www.postgresql.org/docs/current/tutorial-window.html"]]},
  "sql-perf":  {n:"SQL: EXPLAIN, indexes, why your query is slow",                          tr:"data", h:2, sec:"SQL",    sk:"sql", lk:[["Using EXPLAIN","https://www.postgresql.org/docs/current/using-explain.html"]]},
  "sql-anal":  {n:"Analytics SQL: cohort, funnel, retention, metric design",                tr:"data", h:3, sec:"SQL",    sk:"sql", lk:[]},
  "api":       {n:"HTTP & REST done properly: methods, status codes, idempotency, versioning", tr:"sys", h:2, sec:"Web", sk:"rest", lk:[["MDN HTTP","https://developer.mozilla.org/en-US/docs/Web/HTTP"]]},
  "framework": {n:"Build a real API: routing, validation, dependency injection, migrations", tr:"sys", h:4, sec:"Web",   sk:"fastapi", lk:[["FastAPI","https://fastapi.tiangolo.com/"],["Express","https://expressjs.com/"]]},
  "auth":      {n:"Auth & security: JWT, OAuth2 flows, RBAC, OWASP API top-10",             tr:"sys",  h:3, sec:"Web",   sk:"jwt", lk:[["OWASP API top 10","https://owasp.org/API-Security/"]]},
  "db-design": {n:"Data modelling, transactions, isolation levels, N+1",                    tr:"sys",  h:3, sec:"SQL",   sk:"postgres", lk:[["Transaction isolation","https://www.postgresql.org/docs/current/transaction-iso.html"]]},
  "cache-q":   {n:"Caching & queues: Redis patterns, workers, retry/backoff, dead letters", tr:"sys",  h:3, sec:"Web",   sk:"redis", lk:[["Redis patterns","https://redis.io/docs/latest/develop/"]]},
  "ship":      {n:"Ship it: Docker, CI/CD, logging, deployment, load testing",              tr:"craft",h:3, sec:"Web",   sk:"docker", lk:[["Docker","https://docs.docker.com/get-started/"],["GitHub Actions","https://docs.github.com/actions"]]},
  "sysd-1":    {n:"System design I: load balancing, caching, queues, capacity estimation",   tr:"craft",h:3, sec:"Web",   sk:"", lk:[["System design primer","https://github.com/donnemartin/system-design-primer"]]},
  "sysd-2":    {n:"System design II: sharding, replication, consistency, trade-off talk",    tr:"craft",h:3, sec:"Web",   sk:"", lk:[]},
  "lld":       {n:"Low-level design / machine coding: 90-minute working-code drills",        tr:"craft",h:3, sec:"DSA",   sk:"", lk:[["Refactoring Guru patterns","https://refactoring.guru/design-patterns"]]},
  "llm-base":  {n:"LLM foundations: tokens, context, sampling, structured outputs",          tr:"ai",   h:3, sec:"ML/AI", sk:"llm", lk:[["Anthropic docs","https://docs.anthropic.com/"]]},
  "prompt":    {n:"Serious prompt engineering + JSON-mode reliability",                     tr:"ai",   h:2, sec:"ML/AI", sk:"llm", lk:[]},
  "tools":     {n:"Tool use / function calling, and an agent loop from scratch",             tr:"ai",   h:3, sec:"ML/AI", sk:"agent", lk:[]},
  "mcp":       {n:"Build your own MCP server (rare on a junior CV — high signal)",           tr:"ai",   h:3, sec:"ML/AI", sk:"mcp", lk:[["MCP spec","https://modelcontextprotocol.io/"]]},
  "rag":       {n:"RAG: embeddings, chunking, vector search, hybrid retrieval, citations",   tr:"ai",   h:4, sec:"ML/AI", sk:"rag", lk:[]},
  "evals":     {n:"Evals: golden sets, LLM-as-judge, regression evals in CI",                tr:"ai",   h:3, sec:"ML/AI", sk:"eval", lk:[]},
  "guard":     {n:"Guardrails, PII, prompt injection, cost & latency control",               tr:"ai",   h:2, sec:"ML/AI", sk:"", lk:[]},
  "ml-core":   {n:"ML core: bias-variance, train/val/test, metrics that matter",             tr:"ai",   h:3, sec:"ML/AI", sk:"sklearn", lk:[["sklearn guide","https://scikit-learn.org/stable/user_guide.html"]]},
  "ml-sk":     {n:"Trees, random forests, gradient boosting, pipelines, cross-validation",   tr:"ai",   h:3, sec:"ML/AI", sk:"sklearn", lk:[]},
  "ml-real":   {n:"Feature engineering, leakage, imbalanced data, SHAP interpretation",      tr:"ai",   h:3, sec:"ML/AI", sk:"", lk:[]},
  "ml-dl":     {n:"PyTorch: tensors, autograd, a training loop, transfer learning",          tr:"ai",   h:4, sec:"ML/AI", sk:"pytorch", lk:[["PyTorch tutorials","https://pytorch.org/tutorials/"]]},
  "mlops":     {n:"MLOps: experiment tracking, serving, monitoring, drift",                  tr:"craft",h:3, sec:"ML/AI", sk:"mlflow", lk:[["MLflow","https://mlflow.org/docs/latest/"]]},
  "stats":     {n:"Statistics: distributions, sampling, confidence intervals",               tr:"data", h:3, sec:"Stats", sk:"statistics", lk:[]},
  "ab":        {n:"Hypothesis testing & A/B analysis you can defend",                        tr:"data", h:3, sec:"Stats", sk:"", lk:[]},
  "viz":       {n:"Excel power tools + BI dashboards + executive storytelling",              tr:"data", h:3, sec:"Stats", sk:"powerbi", lk:[]},
  "frontend":  {n:"Frontend craft: accessibility, forms, state, performance",               tr:"sys",  h:3, sec:"Web",   sk:"css", lk:[["web.dev","https://web.dev/learn"]]},
  "behav":     {n:"Behavioural: STAR stories from your own real work",                       tr:"craft",h:2, sec:"",      sk:"", lk:[]},
  "resume":    {n:"Resume & positioning pass: title framing, bullets that survive scrutiny", tr:"craft",h:2, sec:"",      sk:"", lk:[]}
};

/* Ordered topic sequence per role. Shared ids reused deliberately. */
const ROLE_PLAN = {
  backend:   ["py-core","sql-join","api","py-adv","sql-cte","framework","java-core","sql-win","auth","db-design","java-conc","cache-q","sql-perf","spring","ship","py-test","sysd-1","lld","sysd-2","behav","resume"],

/* =====================================================================
   résumé parsing — entirely local
   ===================================================================== */
function parseResume(text){
  const t=(text||"").toLowerCase();
  const found={};
  for(const [key,words] of Object.entries(SKILLS))
    if(words.some(w=>t.includes(w))) found[key]=true;
  // years of experience: explicit statement first, then date ranges
  let yoe=null;
  const m=t.match(/(\d+(?:\.\d+)?)\+?\s*(?:years?|yrs?)\s*(?:of\s*)?(?:experience|exp)/);
  if(m) yoe=parseFloat(m[1]);
  if(yoe==null){
    const years=[...t.matchAll(/\b(19|20)\d{2}\b/g)].map(x=>+x[0]).filter(y=>y>=1990&&y<=2100);
    if(years.length>=2){ const span=Math.max(...years)-Math.min(...years); if(span>0&&span<=15) yoe=Math.min(span,12); }
  }
  const senior=/\b(senior|lead|principal|staff|architect|manager)\b/.test(t);
  const fresher=/\b(fresher|intern|graduate|student|no experience)\b/.test(t) && !senior;
  return {skills:Object.keys(found), yoe, senior, fresher, chars:(text||"").length};
}

function sectionPct(sec){
  const d=S.quiz.diag; if(!d||!d.sections||!d.sections[sec]) return null;
  const [ok,n]=d.sections[sec].split("/").map(Number);
  return n? Math.round(100*ok/n) : null;
}
function generatePlan(setup){
  const {role,weeks,hours,resume}=setup;
  const known=new Set(resume?resume.skills:[]);
  const ids=ROLE_PLAN[role].slice();

  // Budget: reserve ~30% of every week for DSA, the capstone and review.
  const studyBudget=weeks*hours*0.7;

  // Score each topic: weak diagnostic section → boost; proven on résumé + strong section → compress.
  const chosen=[], dropped=[];
  let spent=0;
  for(const id of ids){
    const t=T[id]; if(!t) continue;
    const pct=t.sec?sectionPct(t.sec):null;
    const proven=t.sk&&known.has(t.sk);
    let hrs=t.h, mode="learn";
    if(proven&&(pct===null||pct>=75)){ hrs=Math.max(1,Math.round(t.h*0.4)); mode="verify"; }
    else if(pct!==null&&pct<50){ hrs=t.h+1; mode="focus"; }
    if(spent+hrs>studyBudget && chosen.length>=Math.max(4,Math.ceil(weeks/2))){ dropped.push({n:t.n,h:t.h}); continue; }
    chosen.push({id,...t,hrs,mode}); spent+=hrs;
  }

  // Braid: round-robin across tracks so a week is never single-subject.
  const byTrack={};
  chosen.forEach(c=>{ (byTrack[c.tr]=byTrack[c.tr]||[]).push(c); });
  const order=Object.keys(byTrack).sort((a,b)=>byTrack[b].length-byTrack[a].length);
  const braided=[]; let more=true;
  while(more){ more=false; for(const tr of order){ const q=byTrack[tr]; if(q&&q.length){ braided.push(q.shift()); more=true; } } }

  // Pack into weeks. Spread EVENLY so no week is ever blank, cap by weekly
  // hours, and fill genuine slack with spaced revision instead of dead space.
  const spread=Math.max(1,Math.ceil(braided.length/weeks));
  const hourCap=Math.max(2,hours*0.7);
  const cap=CAPSTONE[role], capAt=[];
  for(let i=0;i<cap.steps.length;i++) capAt.push(Math.min(weeks-1, Math.floor((i+1)*weeks/(cap.steps.length+1))));
  const dsaPerWeek = hours<=5?2 : hours<=10?3 : 4;

  const plan=[]; let idx=0;
  for(let w=1;w<=weeks;w++){
    const topics=[]; let acc=0;
    while(idx<braided.length && topics.length<spread && (acc<hourCap || topics.length===0) && topics.length<3){
      topics.push(braided[idx]); acc+=braided[idx].hrs; idx++;
    }
    // No new material left? Revisit earlier topics without notes — spacing is
    // what makes week 3's material survive until the interview.
    let revision=[];
    if(!topics.length && chosen.length){
      const a=chosen[(w*2)%chosen.length], b=chosen[(w*2+1)%chosen.length];
      revision=[...new Set([a,b])];
    }
    plan.push({
      w, topics, revision,
      dsa:{pattern:DSA[(w-1)%DSA.length], count:dsaPerWeek},
      capstone:cap.steps.filter((_,i)=>capAt[i]===w-1),
      quizSecs:[...new Set([...topics,...revision].map(t=>t.sec).filter(Boolean))],
      isFinal:w===weeks
    });
  }
  while(idx<braided.length){ plan[plan.length-1].topics.push(braided[idx++]); }
  return {role,weeks,hours,capstone:cap.n,list:plan,dropped,
    budget:{total:weeks*hours,study:Math.round(studyBudget),spent},
    generated:new Date().toISOString().slice(0,10)};
}
function stagesOf(plan){
  const n=plan.list.length, per=Math.ceil(n/4);
  const names=[["S1","Foundations"],["S2","Build"],["S3","Deepen"],["S4","Prove"]];
  const out=[];
  for(let i=0;i<4;i++){
    const ws=plan.list.slice(i*per,(i+1)*per).map(x=>x.w);
    if(ws.length) out.push({code:names[i][0],name:names[i][1],weeks:ws});
  }
  return out;
}

function readFile(f,rt,scan){
  const name=(f.name||"").toLowerCase();
  if(name.endsWith(".docx")){ readDocx(f).then(txt=>{ rt.value=txt; scan(); })
    .catch(()=>{ rt.value=""; rt.placeholder="Could not read that .docx — please open it, select all, copy and paste here."; scan(); }); return; }
  if(name.endsWith(".pdf")){ rt.value=""; rt.placeholder="PDFs cannot be read reliably in a browser without extra software. Open your PDF, press Ctrl+A then Ctrl+C, and paste here."; scan(); return; }
  const fr=new FileReader();
  fr.onload=()=>{ rt.value=String(fr.result||""); scan(); };
  fr.readAsText(f);
}
/* .docx is a zip; pull word/document.xml out with the browser's own inflater. */
async function readDocx(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const dv=new DataView(buf.buffer);
  let text="";
  for(let i=0;i<buf.length-3;i++){
    if(dv.getUint32(i,true)!==0x04034b50) continue;                 // local file header
    const method=dv.getUint16(i+8,true), comp=dv.getUint32(i+18,true);
    const nameLen=dv.getUint16(i+26,true), extraLen=dv.getUint16(i+28,true);
    const name=new TextDecoder().decode(buf.slice(i+30,i+30+nameLen));
    if(name!=="word/document.xml") continue;
    const start=i+30+nameLen+extraLen;
    const body=buf.slice(start,start+comp);
    let xml;
    if(method===0) xml=new TextDecoder().decode(body);
    else {
      const ds=new DecompressionStream("deflate-raw");
      const stream=new Blob([body]).stream().pipeThrough(ds);
      xml=await new Response(stream).text();
    }
    text=xml.replace(/<\/w:p>/g,"\n").replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/[ \t]+/g," ");
    break;
  }
  if(!text.trim()) throw new Error("no document.xml");
  return text;
}

function weekFraction(w){
  const st=S.status[w]||"todo"; if(st==="done") return 1;
  const steps=weekSteps(w); if(!steps.length) return st==="doing"?.15:0;
  const done=steps.filter((_,i)=>S.tasks[w+":"+i]).length/steps.length;
  return st==="doing"?Math.max(done,.05):done;
}
function programPct(){
  if(!S.plan) return {pct:0,done:0,weeks:0};
  const ws=S.plan.list.map(x=>x.w);
  const sum=ws.reduce((a,w)=>a+weekFraction(w),0);
  return {pct:Math.round(1000*sum/ws.length)/10, weeks:ws.length, done:ws.filter(w=>(S.status[w]||"todo")==="done").length};
}

/* Steps are derived from the plan, so they stay stable for tick indices. */
function weekSteps(w){
  if(!S.plan) return [];
  const wk=S.plan.list.find(x=>x.w==w); if(!wk) return [];
  const steps=[];
  wk.topics.forEach(t=>steps.push({
    t:(t.mode==="verify"?"Verify (you may already know this): ":t.mode==="focus"?"Focus area — extra time: ":"Study: ")+t.n,
    d:(t.mode==="verify"?"Your resume suggests you have this. Skim to confirm, then move on — do not spend a full session here."
      :t.mode==="focus"?"Your diagnostic flagged this section, so it gets more time than default. Slow down."
      :"")+` (~${t.hrs} h)`,
    links:t.lk
  }));
  (wk.revision||[]).forEach(t=>steps.push({
    t:"Spaced revision: "+t.n,
    d:"No new material this week — that is deliberate. Redo the hardest exercise from this topic WITHOUT looking at your notes. Recalling it cold is what makes it survive until the interview; re-reading it does not.",
    links:t.lk
  }));
  steps.push({t:`${wk.dsa.count} DSA problems — ${wk.dsa.pattern}`,
    d:"Write them yourself, then save each solution in a dsa/ folder. Pattern recognition is what transfers; volume without review does not.",
    links:[["NeetCode roadmap",DSA_LINK]]});
  wk.capstone.forEach(c=>steps.push({t:"Project: "+c, d:"This is the part interviewers actually ask about. Commit it publicly."}));
  steps.push({t:`Week ${wk.w} quiz`, quiz:"w"+wk.w, d:"Take it at the end of the week, closed book."});
  if(wk.isFinal) steps.push({t:"Final pass: resume rewrite + mock interview + portfolio README polish",
    d:"Rehearse each project out loud in under 3 minutes: problem, decisions, trade-offs, measured result."});
  return steps;
}

function gradeQuiz(quiz,host,id){
  const boxes=$$(".qbox",host), answers=[];
  boxes.forEach((b,i)=>{ const s=b.querySelector("input:checked"); answers[i]=s?+s.value:null; });
  const missing=answers.findIndex(a=>a===null);
  if(missing>=0){ $("#qnote",host).textContent=answers.filter(a=>a===null).length+" unanswered";
    boxes[missing].scrollIntoView({behavior:"smooth",block:"center"}); return; }
  let score=0; const bySec={}, missed=[];
  boxes.forEach((b,i)=>{
    const q=quiz.qs[i], right=answers[i]===q.a;
    if(right) score++; else missed.push((i+1)+(q.sec?" "+q.sec:""));
    if(q.sec){ bySec[q.sec]=bySec[q.sec]||{ok:0,n:0}; bySec[q.sec].n++; if(right) bySec[q.sec].ok++; }
    b.classList.add("graded");
    $$(".optn",b).forEach((o,j)=>{ o.querySelector("input").disabled=true;
      if(j===q.a) o.classList.add("right"); else if(j===answers[i]) o.classList.add("wrong"); });
    $(".expl",b).textContent=q.x;
  });
  const total=quiz.qs.length, pct=Math.round(100*score/total), prev=S.quiz[quiz.id];
  if(!prev||pct>=prev.pct){
    S.quiz[quiz.id]={score,total,pct,missed,date:new Date().toISOString().slice(0,10),
      sections:quiz.sections?Object.fromEntries(Object.entries(bySec).map(([k,v])=>[k,v.ok+"/"+v.n])):undefined};
    save();
  }
  const verdict=pct>=85?"Strong — this will not be what holds you back.":pct>=65?"Solid base with real gaps — the plan will target them."
    :"Useful signal. A low score here just means the plan puts your hours where they matter.";
  $("#rslot",host).innerHTML=`<div class="result"><div class="big">${score}/${total} <small style="font-size:15px;color:var(--muted)">(${pct}%)</small></div>
    <div style="margin:6px 0 10px">${verdict}</div>
    ${quiz.sections?Object.entries(bySec).map(([k,v])=>{
      const sp=Math.round(100*v.ok/v.n);
      return `<div class="secline"><span>${esc(k)}</span><span><span class="chip ${sp>=75?"ok":sp>=50?"warn":"bad"}">${v.ok}/${v.n}</span></span></div>`;
    }).join(""):""}
    <div class="row">${id==="diag"?`<button class="go" id="qdone">Continue &rarr;</button>`:`<button class="go" id="qdone">Back to plan</button>`}
      <button class="ghost" id="qretake">Retake</button></div></div>`;
  $("#qretake",host).addEventListener("click",()=>runQuiz(id));
  $("#qdone",host).addEventListener("click",()=>{
    if(id==="diag"){ S.step=3; save(); renderSetup(); }
    else { showView("roadmap"); renderAll(); }
  });
  $("#rslot",host).scrollIntoView({behavior:"smooth",block:"start"});
  if(id!=="diag"){ renderProgress(); renderNow(); }
}

/* ---------------- progress ---------------- */
function renderProgress(){
  const host=$("#view-progress"); if(!S.plan){ host.innerHTML=""; return; }
  const p=programPct(), qs=Object.values(S.quiz);
  const avg=qs.length?Math.round(qs.reduce((a,q)=>a+q.pct,0)/qs.length):null;
  const dsaTarget=S.plan.list.reduce((a,w)=>a+w.dsa.count,0);
  host.innerHTML=`
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px">
      <span><span style="font-size:30px;font-weight:800">${fmtPct(p.pct)}</span> <span class="hint" style="margin:0">of your ${p.weeks}-week plan</span></span>
      <span class="hint" style="margin:0">${esc(ROLES[S.setup.role].n)} · ${S.setup.hours} h/week</span></div>
      <span class="bar" style="height:14px;display:block;margin-top:8px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p.pct)}"><i style="width:${barW(p.pct)}"></i></span>
      <p class="hint">Counts finished weeks plus part-credit for steps ticked in the week you are on.</p></div>
    <div class="tiles">
      <div class="tile"><div class="lbl">Weeks complete</div><div class="val">${p.done}<small> / ${p.weeks}</small></div>
        <span class="bar"><i style="width:${barW(100*p.done/p.weeks)}"></i></span></div>
      <div class="tile"><div class="lbl">Quiz average</div><div class="val">${avg===null?"—":avg+"<small>%</small>"}</div>
        <div class="hint">${qs.length} taken (best scores)</div></div>
      <div class="tile"><div class="lbl">DSA solved</div><div class="val">${S.dsa}<small> / ${dsaTarget}</small>
        <span style="float:right"><button class="ghost" id="dm" aria-label="decrease" style="padding:2px 9px">−</button>
        <button class="ghost" id="dp" aria-label="increase" style="padding:2px 9px">+</button></span></div>
        <span class="bar"><i style="width:${barW(Math.min(100,100*S.dsa/dsaTarget))}"></i></span></div>
    </div>
    ${(S.plan.dropped&&S.plan.dropped.length)?`<div class="card">
      <h2 style="font-size:16px">What your ${S.plan.budget.total} hours could not fit</h2>
      <p class="hint">${S.plan.weeks} weeks × ${S.setup.hours} h leaves about ${S.plan.budget.study} study hours after DSA and project time.
      These topics did not fit, and pretending otherwise would just set you up to fail. They are listed newest-priority-first —
      if you find extra hours, add them in this order.</p>
      ${S.plan.dropped.map(d=>`<div class="prow"><span class="pn" style="flex:1;min-width:0">${esc(d.n)}</span><span class="pct">~${d.h} h</span></div>`).join("")}
      <p class="hint">Want them in? Start over with a longer timeline or more hours per week — the plan rebuilds around whatever you can actually give it.</p></div>`:""}
    <div class="card"><h2 style="font-size:16px">Back up your progress</h2>
      <p class="hint">Your progress lives in this browser only. Export a file before switching machines, clearing history, or if the save chip above ever says “not saved”.</p>
      <div class="row"><button class="go" id="exp">Export progress file</button>
        <button class="ghost" id="imp">Import a file</button>
        <input type="file" id="impf" accept=".json" hidden>
        <button class="ghost" id="reset" style="margin-left:auto;color:var(--bad)">Start over</button></div>
      <p class="hint" id="iomsg"></p></div>`;
  $("#dp",host).addEventListener("click",()=>{S.dsa++;save();renderProgress();});
  $("#dm",host).addEventListener("click",()=>{S.dsa=Math.max(0,S.dsa-1);save();renderProgress();});
  $("#exp",host).addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="launchpad-progress.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    $("#iomsg",host).textContent="Exported. Keep that file safe — importing it restores everything.";
  });
  $("#imp",host).addEventListener("click",()=>$("#impf",host).click());
  $("#impf",host).addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{ const o=JSON.parse(String(fr.result));
        if(!o||!o.plan) throw new Error("no plan in file");
        S=o; save(); renderAll(); $("#iomsg",$("#view-progress")).textContent="Imported.";
      }catch(err){ $("#iomsg",host).textContent="That file could not be read as a progress export."; } };
    fr.readAsText(f);
  });
  $("#reset",host).addEventListener("click",()=>{
    if(!confirm("Delete your plan and all progress on this device? Export first if you want a backup.")) return;
    S=blank(); try{ localStorage.removeItem(KEY); }catch(e){}
    wiz={role:null,weeks:null,hours:null,resumeText:"",resume:null};
    $("#nav").hidden=true; $("#topbar").hidden=true; $("#now").hidden=true;
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="view-setup"));
    renderSetup(); window.scrollTo(0,0);
  });
}
function renderAll(){ renderRoadmap(); renderQuizList(); renderProgress(); renderNow(); }

/* ---------------- boot ---------------- */
$("#nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]"); if(!b) return;
  showView(b.dataset.v);
  if(b.dataset.v==="roadmap") renderRoadmap();
  if(b.dataset.v==="quizzes") renderQuizList();
  if(b.dataset.v==="progress") renderProgress();
});
load(); paintChip(); storageBanner();
if(S.plan&&S.setup){
  $("#hdr-title").textContent=ROLES[S.setup.role].n+" · "+S.plan.weeks+" weeks";
  $("#nav").hidden=false; $("#topbar").hidden=false;
  $$(".view").forEach(v=>v.classList.toggle("on",v.id==="view-roadmap"));
  renderAll();
} else {
  if(S.setup){ wiz={...wiz,...S.setup,resumeText:""}; }
  renderSetup();
}
</script>
</body>
</html>
