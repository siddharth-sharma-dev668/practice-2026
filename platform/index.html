<title>Sid's Launchpad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F2F4F6; --surface: #FFFFFF; --surface2: #E9EDF1; --ink: #1B2530; --muted: #5C6B78;
    --line: #D7DEE4; --accent: #D14E12; --accent-ink: #FFFFFF; --accent-soft: #F8E4D8;
    --ok: #237A50; --ok-soft: #DCEFE4; --warn: #96690F; --warn-soft: #F4E8CC; --bad: #B3362B; --bad-soft: #F5DDDA;
    --shadow: 0 1px 3px rgba(27,37,48,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F141A; --surface: #171E26; --surface2: #212B36; --ink: #E6EBEF; --muted: #94A3B0;
      --line: #2B3642; --accent: #F07A3D; --accent-ink: #1F0E04; --accent-soft: #3A2517;
      --ok: #5CBA88; --ok-soft: #1C3427; --warn: #D9A93F; --warn-soft: #362F19; --bad: #E0685C; --bad-soft: #3B211E;
      --shadow: 0 1px 3px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F141A; --surface: #171E26; --surface2: #212B36; --ink: #E6EBEF; --muted: #94A3B0;
    --line: #2B3642; --accent: #F07A3D; --accent-ink: #1F0E04; --accent-soft: #3A2517;
    --ok: #5CBA88; --ok-soft: #1C3427; --warn: #D9A93F; --warn-soft: #362F19; --bad: #E0685C; --bad-soft: #3B211E;
    --shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Public Sans', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55; }
  .mono { font-family: 'IBM Plex Mono', Consolas, monospace; }
  code { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: .88em;
    background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .head-in { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 18px 0 0; flex-wrap: wrap; }
  .eyebrow { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; letter-spacing: .14em;
    color: var(--accent); text-transform: uppercase; font-weight: 600; }
  h1 { font-family: Archivo, 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 26px;
    margin: 2px 0 0; letter-spacing: -.01em; }
  nav { display: flex; gap: 4px; }
  nav button { padding: 10px 14px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent;
    border-radius: 0; }
  nav button:hover { color: var(--ink); }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); }

  /* ---- program progress bar: always visible in the sticky header ---- */
  .topbar { display: flex; align-items: center; gap: 11px; padding: 11px 0 12px; flex-wrap: wrap; }
  .tb-lbl { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .bar { flex: 1 1 200px; min-width: 140px; height: 10px; background: var(--surface2); border: 1px solid var(--line);
    border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .45s cubic-bezier(.4,0,.2,1); }
  .tb-pct { font-family: Archivo, system-ui, sans-serif; font-weight: 800; font-size: 16px;
    font-variant-numeric: tabular-nums; }
  .tb-sub { flex-basis: 100%; font-size: 12.5px; color: var(--muted); margin-top: -4px; }
  .savechip { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.5px; letter-spacing: .04em;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); white-space: nowrap; cursor: help; }
  .savechip.saving { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .savechip.saved  { color: var(--ok);   border-color: var(--ok);   background: var(--ok-soft); }
  .savechip.err    { color: var(--bad);  border-color: var(--bad);  background: var(--bad-soft); }

  /* ---- per-week step bar + progress-tab bars ---- */
  .stepbar { display: flex; align-items: center; gap: 11px; margin: 16px 0 12px; flex-wrap: wrap; }
  .stepbar .bar { height: 8px; }
  .stepbar .lbl { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bigbar { margin: 18px 0 4px; }
  .bigbar .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px;
    flex-wrap: wrap; }
  .bigbar .n { font-family: Archivo, system-ui, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -.02em; }
  .bigbar .bar { height: 14px; flex: none; display: block; width: 100%; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 7px 2px; }
  .prow .pc { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; font-weight: 600;
    color: var(--accent); min-width: 22px; }
  .prow .pn { font-size: 13.5px; min-width: 118px; }
  .prow .pct { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11.5px; color: var(--muted);
    min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

  .now { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin: 20px 0 4px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 8px; box-shadow: var(--shadow); }
  .now .tag { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; letter-spacing: .12em;
    font-weight: 600; color: var(--accent); }
  .now b { font-weight: 700; }
  .now span { color: var(--muted); }

  main { padding: 8px 0 60px; }
  .view { display: none; }
  .view.on { display: block; animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view.on { animation: none; } * { transition: none !important; } }

  .phase { margin-top: 28px; }
  .phase-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .phase-code { font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 600; font-size: 12px;
    color: var(--accent); letter-spacing: .1em; }
  .phase-name { font-family: Archivo, system-ui, sans-serif; font-weight: 700; font-size: 17px; }
  .phase-range { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11.5px; color: var(--muted); }
  .meter { flex: 1 1 60px; height: 4px; background: var(--surface2); border-radius: 2px; min-width: 60px; }
  .meter i { display: block; height: 100%; background: var(--ok); border-radius: 2px; transition: width .3s ease; }
  .phase-count { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .milestone { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .milestone b { color: var(--ok); font-weight: 600; }

  .wk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px;
    box-shadow: var(--shadow); }
  .wk-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
    width: 100%; text-align: left; padding: 11px 14px; border-radius: 8px; }
  .wk-row:hover { background: var(--surface2); }
  .wk-code { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; font-weight: 600; color: var(--muted); }
  .wk-title { font-weight: 600; }
  .wk-dates { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
    font-size: 12px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .pill.doing { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .pill.doing i { background: var(--warn); }
  .pill.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .pill.done i { background: var(--ok); }
  .wkpage-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 14px 0 4px; }
  .wkpage-head h2 { font-family: Archivo, system-ui, sans-serif; font-weight: 800; font-size: 22px; margin: 0; }
  .focusline { color: var(--muted); font-size: 14px; margin: 3px 0 0; }
  .focusline b { color: var(--ink); }
  .steps { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .step { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 15px; box-shadow: var(--shadow); }
  .step input[type=checkbox] { width: 19px; height: 19px; margin-top: 2px; accent-color: var(--ok); cursor: pointer; flex: none; }
  .step .st-t { font-weight: 600; }
  .step.done .st-t { color: var(--muted); text-decoration: line-through; }
  .step .st-d { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .cmd { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .cmd code { padding: 6px 12px; font-size: 13px; }
  .mini { background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px;
    font-size: 12.5px; font-weight: 600; }
  .mini:hover { border-color: var(--accent); color: var(--accent); }
  .linkchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .linkchips a { display: inline-block; padding: 4px 13px; border: 1px solid var(--line); border-radius: 99px;
    font-size: 12.5px; font-weight: 600; color: var(--ink); text-decoration: none; background: var(--surface2); }
  .linkchips a:hover { border-color: var(--accent); color: var(--accent); }
  .takequiz { margin-top: 10px; }
  .locked { border: 1px dashed var(--line); border-radius: 10px; padding: 16px 18px; color: var(--muted);
    font-size: 14px; margin-top: 16px; background: var(--surface); }
  .markdone { margin-top: 14px; }
  .back { color: var(--muted); font-weight: 600; font-size: 13.5px; padding: 12px 0 0; }
  .back:hover { color: var(--ink); }
  .now .go { padding: 6px 14px; font-size: 12.5px; white-space: nowrap; }
  .ready-chip { font-size: 10.5px; margin-left: 8px; vertical-align: 2px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 20px; }
  .qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px;
    text-align: left; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
  .qcard:hover { border-color: var(--accent); }
  .qcard h3 { margin: 0; font-family: Archivo, system-ui, sans-serif; font-size: 16px; font-weight: 700; }
  .qcard .sub { color: var(--muted); font-size: 13px; }
  .best { align-self: flex-start; margin-top: 6px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.dim { background: var(--surface2); color: var(--muted); }
  .go { margin-top: 8px; align-self: flex-start; background: var(--accent); color: var(--accent-ink);
    padding: 7px 16px; border-radius: 7px; font-weight: 700; font-size: 13.5px; }
  .go:hover { filter: brightness(1.08); }

  /* ---- concept lessons: flowchart + text + code + terminal on one page ---- */
  .tag-lbl { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .figure { margin: 16px 0; padding: 14px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); }
  .figure svg { width: 100%; height: auto; display: block; }
  .figure figcaption { margin-top: 10px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .lesson-p { font-size: 14px; color: var(--ink); margin: 0 0 12px; max-width: 68ch; }
  .code-lbl { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; }
  .codeblock { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12.5px;
    line-height: 1.6; overflow-x: auto; white-space: pre; margin: 0 0 4px; }
  .reveal { margin: 4px 0 14px; }
  .reveal summary { cursor: pointer; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px 0; }
  .reveal summary:hover { color: var(--accent); }
  .reveal[open] summary { color: var(--accent); }
  .reveal .codeblock { margin-top: 8px; }

  .datatable-wrap { margin: 16px 0; }
  .datatable-cap { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .datatables-row { display: flex; gap: 26px; flex-wrap: wrap; max-width: 100%; overflow-x: auto; }
  .datatables-row .tname { font-size: 11px; color: var(--muted); margin-bottom: 4px;
    font-family: 'IBM Plex Mono', Consolas, monospace; }
  table.datatable { border-collapse: collapse; font-size: 13px; margin: 0; }
  table.datatable th, table.datatable td { border: 1px solid var(--line); padding: 5px 12px; text-align: left; }
  table.datatable th { background: var(--surface2); font-weight: 700; font-family: 'IBM Plex Mono', Consolas, monospace;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  table.datatable td { font-family: 'IBM Plex Mono', Consolas, monospace; color: var(--ink); }
  table.datatable td.null { color: var(--muted); font-style: italic; }

  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
  @media (max-width: 620px) { .compare-grid { grid-template-columns: 1fr; } }
  .compare-grid .codeblock { margin: 0; }
  .compare-lbl { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 5px; }

  .runner-head { display: flex; align-items: center; gap: 14px; margin: 20px 0 6px; flex-wrap: wrap; }
  .back { color: var(--muted); font-weight: 600; font-size: 13.5px; padding: 6px 10px 6px 0; }
  .back:hover { color: var(--ink); }
  .runner-head h2 { font-family: Archivo, system-ui, sans-serif; font-size: 20px; margin: 0; font-weight: 800; }
  .qbox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
    margin-top: 10px; box-shadow: var(--shadow); }
  .qsec { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .qtext { font-weight: 600; margin: 0 0 10px; }
  .qtext .qn { font-family: 'IBM Plex Mono', Consolas, monospace; color: var(--muted); font-weight: 500;
    margin-right: 8px; font-size: 13px; }
  .opt { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 7px; margin-bottom: 6px; cursor: pointer; font-size: 14px; }
  .opt:hover { background: var(--surface2); }
  .opt input { accent-color: var(--accent); }
  .graded .opt { cursor: default; }
  .graded .opt:hover { background: none; }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .expl { display: none; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line);
    margin-top: 8px; padding-top: 8px; }
  .graded .expl { display: block; }
  .submit-bar { position: sticky; bottom: 0; background: var(--bg); padding: 14px 0; margin-top: 8px;
    border-top: 1px solid var(--line); display: flex; gap: 14px; align-items: center; }
  .warn-note { color: var(--bad); font-weight: 600; font-size: 13.5px; }
  .result { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--surface);
    border-radius: 10px; padding: 18px; margin-top: 20px; box-shadow: var(--shadow); }
  .result .big { font-family: Archivo, system-ui, sans-serif; font-size: 34px; font-weight: 800;
    font-variant-numeric: tabular-nums; }
  .result .verdict { font-weight: 600; margin-top: 2px; }
  .secline { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px dashed var(--line);
    font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .secline:first-of-type { margin-top: 10px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
    box-shadow: var(--shadow); }
  .tile .lbl { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tile .val { font-family: Archivo, system-ui, sans-serif; font-size: 30px; font-weight: 800; margin: 4px 0 8px;
    font-variant-numeric: tabular-nums; }
  .tile .val small { font-size: 15px; color: var(--muted); font-weight: 600; }
  .stepper { display: inline-flex; gap: 6px; margin-left: 10px; vertical-align: middle; }
  .stepper button { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 6px; font-weight: 700;
    line-height: 1; background: var(--surface2); font-size: 15px; }
  .stepper button:hover { border-color: var(--accent); color: var(--accent); }
  .mlist { margin-top: 24px; }
  h2.sec-h { font-family: Archivo, system-ui, sans-serif; font-size: 18px; font-weight: 800; margin: 28px 0 10px; }
  .mrow { display: flex; gap: 14px; align-items: baseline; padding: 9px 4px; border-bottom: 1px dashed var(--line);
    flex-wrap: wrap; }
  .mrow .d { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: var(--muted); min-width: 90px;
    font-variant-numeric: tabular-nums; }
  .mrow .n { font-weight: 600; flex: 1; }
  textarea.export { width: 100%; min-height: 130px; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    resize: vertical; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .copy { background: var(--accent); color: var(--accent-ink); padding: 8px 18px; border-radius: 7px; font-weight: 700; }
  .copy:hover { filter: brightness(1.08); }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; padding: 16px 0 30px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
</style>

<header>
  <div class="wrap head-in">
    <div>
      <div class="eyebrow">Mission plan · 24 weeks · 5 roles</div>
      <h1>Sid's Launchpad</h1>
    </div>
    <nav id="nav">
      <button data-v="roadmap" class="on">Roadmap</button>
      <button data-v="quizzes">Quizzes</button>
      <button data-v="progress">Progress</button>
    </nav>
  </div>
  <div class="wrap topbar">
    <span class="tb-lbl">Progress</span>
    <span class="bar" role="progressbar" aria-label="Overall program progress"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="tb-bar"><i id="tb-fill" style="width:0"></i></span>
    <span class="tb-pct" id="tb-pct">0%</span>
    <span class="savechip" id="savechip">…</span>
    <span class="tb-sub" id="tb-sub"></span>
  </div>
</header>

<main class="wrap">
  <div class="now" id="now"></div>

  <section class="view on" id="view-roadmap"></section>
  <section class="view" id="view-quizzes"></section>
  <section class="view" id="view-progress"></section>
</main>

<footer>
  <div class="wrap">
    <span>Built by Claude for Siddharth Sharma · Aug 2026 → Feb 2027</span>
    <span>Say <code>start week N</code> in chat to generate each week's content</span>
  </div>
</footer>

<script>
"use strict";
/* ---------------- data ---------------- */
/* 4 stages, not 7 role-phases: every week braids backend + AI/ML + data/Java + DSA,
   so nothing goes cold before February (the mistake that left Java rusty). */
const PHASES = [
  { code: "S0", name: "Setup & Diagnostic", range: "Aug 21–23", weeks: [0] },
  { code: "S1", name: "Foundations", range: "Aug 24 – Oct 4", weeks: [1, 2, 3, 4, 5, 6],

/* ---------------- state + persistence ----------------
   Two layers, because layer 1 alone silently lost every tick:
   1. localStorage — instant, but THROWS in the artifact viewer's sandboxed frame
      (opaque origin), which is why progress reset to 0 on every reload.
   2. data/progress.json written back into the artifact itself via the `artifact`
      capability — survives reloads and follows Sid across devices. The files form
      of publish() does NOT reload this view, so ticking stays flicker-free.       */
const KEY = "launchpad.v1";
const DATA_PATH = "data/progress.json";
const RANK = { todo: 0, doing: 1, done: 2 };

function blankState() { return { rev: 0, status: {}, quiz: {}, dsa: 0, tasks: {} }; }
function normalize(o) {
  const s = Object.assign(blankState(), o || {});
  s.status = s.status || {};  // weekNum -> todo|doing|done
  s.quiz = s.quiz || {};      // quizId -> {score,total,pct,date,sections?}
  s.tasks = s.tasks || {};    // "week:stepIndex" -> bool
  s.dsa = Number(s.dsa) || 0;
  s.rev = Number(s.rev) || 0;
  return s;
}
let S = blankState(), localOK = true;
try { S = normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { localOK = false; }

/* Never lose a tick: on two divergent copies keep the more advanced value per field. */
function merge(a, b) {
  const hi = (b.rev || 0) > (a.rev || 0) ? b : a, lo = hi === b ? a : b;
  const out = normalize(JSON.parse(JSON.stringify(hi)));
  out.rev = Math.max(a.rev || 0, b.rev || 0);
  out.dsa = Math.max(a.dsa || 0, b.dsa || 0);
  for (const [id, q] of Object.entries(lo.quiz || {}))
    if (!out.quiz[id] || (q.pct || 0) > (out.quiz[id].pct || 0)) out.quiz[id] = q;
  for (const [k, v] of Object.entries(lo.tasks || {}))
    if (v && !(k in out.tasks)) out.tasks[k] = true;      // an untick is stored as false, so it survives
  for (const [k, v] of Object.entries(lo.status || {}))
    if ((RANK[v] || 0) > (RANK[out.status[k]] || 0)) out.status[k] = v;
  return out;
}

let cloud = null;                       // artifact namespace, once the viewer grants it
let mode = "local";                     // local | cloud | readonly
let saveTimer = null, saving = false, dirty = false, debounce = 1200;

function setChip(cls, text, title) {
  const el = document.getElementById("savechip");
  if (!el) return;
  el.className = "savechip " + cls; el.textContent = text; el.title = title || "";
}
function saveNote() {
  return mode === "cloud" ? "saved in your artifact — survives reload, any device"
       : mode === "readonly" ? "read-only view — changes won't stick"
       : localOK ? "saved in this browser only" : "not being saved — reload will clear this";
}
function chipIdle() {
  if (mode === "cloud") setChip("saved", "saved ✓", "Written into the artifact itself — survives reload and follows you across devices.");
  else if (mode === "readonly") setChip("err", "read-only", "This view can't write to the artifact, so ticks won't persist.");
  else setChip("", localOK ? "this device only" : "not saved", localOK
    ? "Saved in this browser's storage only. Open the artifact link for progress that persists everywhere."
    : "This browser blocks local storage here, so progress lasts only until you reload.");
}

function save() {
  S.rev = (S.rev || 0) + 1;
  try { localStorage.setItem(KEY, JSON.stringify(S)); localOK = true; } catch (e) { localOK = false; }
  renderTop();
  if (!cloud) { chipIdle(); return; }
  dirty = true;
  setChip("saving", "saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, debounce);          // batch rapid ticks into one version
}

async function readCloud() {
  try {
    const res = await fetch(DATA_PATH + "?r=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return null;
    return normalize(await res.json());
  } catch (e) { return null; }
}

async function flush() {
  if (!cloud || saving || !dirty) return;
  saving = true; dirty = false;
  const snapshot = JSON.stringify(S, null, 2);
  try {
    await cloud.publish({ [DATA_PATH]: snapshot });
    saving = false;
    if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); return; }
    mode = "cloud"; chipIdle();
  } catch (err) {
    saving = false;
    const code = (err && err.code) || "upstream_error";
    if (code === "conflict") {                       // another view published first — take its version
      const remote = await readCloud();
      if (remote) { S = merge(S, remote); renderAll(); }
      chipIdle();
    } else if (code === "rate_limited") {
      debounce = Math.min(15000, debounce * 3); dirty = true;
      clearTimeout(saveTimer); saveTimer = setTimeout(flush, debounce);
      setChip("saving", "saving…", "Slowing saves down to respect a rate limit.");
    } else if (["not_writer", "not_granted", "not_declared", "capability_disabled",
                "capability_removed", "consent_required"].includes(code)) {
      cloud = null; mode = (code === "not_writer") ? "readonly" : "local"; chipIdle();
    } else {                                         // transient: retry once, then fall back quietly
      dirty = true;
      setChip("err", "retrying…", "Save failed once; trying again.");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flush, 1500 + Math.floor(Math.random() * 1500));
    }
  }
}

/* Light cloud saving up when the viewer answers — never during this first synchronous run. */
(async () => {
  if (!(window.claude && typeof window.claude.use === "function")) { chipIdle(); return; }
  const ns = await window.claude.use("artifact");
  if (!ns) { chipIdle(); return; }
  cloud = ns; mode = "cloud";
  const remote = await readCloud();
  if (remote) {
    const before = JSON.stringify(S);
    S = merge(S, remote);
    if (JSON.stringify(S) !== before) renderAll();
  }
  if (dirty) flush(); else chipIdle();
})();

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && dirty) flush();   // don't lose a tick on tab-away
});

function openQuiz(id) { showView("quizzes"); renderRunner(id); window.scrollTo(0, 0); }

function renderRoadmap() {
  const host = $("#view-roadmap");
  host.innerHTML = `<p class="hint" style="margin-top:14px">Click a week to open its lessons, tasks and assessments. Click a status pill to cycle to-do → in progress → done.</p>` + PHASES.map(p => {
    const done = p.weeks.filter(w => S.status[w] === "done").length;
    const rows = p.weeks.map(w => {
      const wk = WEEKS[w];
      const st = S.status[w] || "todo";
      return `<div class="wk" data-w="${w}">
        <button class="wk-row">
          <span class="wk-code">W${String(w).padStart(2, "0")}</span>
          <span><span class="wk-title">${esc(wk.t)}</span>${CONTENT[w] ? '<span class="chip ok ready-chip">ready</span>' : ""}<br><span class="wk-dates">${esc(wk.d)}</span></span>
          <span class="pill ${st}" data-pill role="button" tabindex="0" title="Click to cycle status"><i></i>${SLABEL[st]}</span>
        </button>
      </div>`;
    }).join("");
    return `<section class="phase">
      <div class="phase-head">
        <span class="phase-code">${p.code}</span>
        <span class="phase-name">${esc(p.name)}</span>
        <span class="phase-range">${esc(p.range)}</span>
        <span class="meter"><i style="width:${p.weeks.length ? (100 * done / p.weeks.length) : 0}%"></i></span>
        <span class="phase-count">${done}/${p.weeks.length}</span>
      </div>
      ${rows}
      ${p.milestone ? `<p class="milestone"><b>Milestone:</b> ${esc(p.milestone)}</p>` : ""}
    </section>`;
  }).join("");

  host.querySelectorAll(".wk").forEach(el => {
    const row = $(".wk-row", el);
    const pill = $("[data-pill]", el);
    const w = el.dataset.w;
    row.addEventListener("click", e => {
      if (e.target.closest("[data-pill]")) return;
      renderWeek(w);
    });
    const cycle = e => {
      e.stopPropagation();
      const cur = S.status[w] || "todo";
      S.status[w] = STATUSES[(STATUSES.indexOf(cur) + 1) % 3];
      save(); renderRoadmap(); renderProgress(); renderNow();
    };
    pill.addEventListener("click", cycle);
    pill.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cycle(e); } });
  });
  window.scrollTo(0, 0);
}

function stepHTML(w, i, s) {
  const done = !!S.tasks[w + ":" + i];
  const best = s.quiz ? S.quiz[s.quiz] : null;
  return `<div class="step ${done ? "done" : ""}">
    <input type="checkbox" data-task="${w}:${i}" ${done ? "checked" : ""} aria-label="mark step done">
    <span style="flex:1">
      <span class="st-t">${esc(s.t)}</span>
      ${s.d ? `<div class="st-d">${esc(s.d)}</div>` : ""}
      ${s.cmd ? `<div class="cmd"><code>${esc(s.cmd)}</code><button class="mini" data-copy="${esc(s.cmd)}">copy</button></div>` : ""}
      ${s.links ? `<div class="linkchips">${s.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join("")}</div>` : ""}
      ${s.quiz ? `<div class="takequiz"><button class="go" data-openquiz="${s.quiz}">${best ? "Retake" : "Take"} the quiz →</button>${best ? ` <span class="chip ${best.pct >= 70 ? "ok" : "warn"}" style="margin-left:8px">best: ${best.score}/${best.total}</span>` : ""}</div>` : ""}
    </span>
  </div>`;
}

function renderWeek(w) {
  const host = $("#view-roadmap");
  const wk = WEEKS[w];
  const c = CONTENT[w];
  const st = S.status[w] || "todo";
  const steps = c ? c.steps : [];
  const doneCount = steps.filter((_, i) => S.tasks[w + ":" + i]).length;
  host.innerHTML = `
    <button class="back">&larr; Roadmap</button>
    <div class="wkpage-head">
      <span class="wk-code" style="font-size:14px">W${String(w).padStart(2, "0")}</span>
      <h2>${esc(wk.t)}</h2>
      <span class="pill ${st}" data-pill role="button" tabindex="0" title="Click to cycle status"><i></i>${SLABEL[st]}</span>
      <span class="phase-range">${esc(wk.d)}</span>
    </div>
    <p class="focusline"><b>Focus:</b> ${esc(wk.f)}</p>
    <p class="focusline"><b>Ship by Sunday:</b> ${esc(wk.s)}</p>
    ${LESSONS[w] ? `
      <h2 class="sec-h" style="margin:22px 0 10px">Concepts — learn these, then do the steps below</h2>
      <div class="cards">${LESSONS[w].map(l => `
        <div class="qcard">
          <span class="tag-lbl">${esc(l.tag)}</span>
          <h3>${esc(l.title)}</h3>
          <span class="sub">${esc(l.sub)}</span>
          <button class="go" data-openlesson="${esc(l.id)}">Open lesson →</button>
        </div>`).join("")}</div>
    ` : ""}
    ${c ? `
      <div class="stepbar">
        <span class="lbl">${doneCount}/${steps.length} steps</span>
        <span class="bar" role="progressbar" aria-label="Week ${Number(w)} steps complete" aria-valuemin="0"
          aria-valuemax="100" aria-valuenow="${Math.round(100 * doneCount / (steps.length || 1))}"
          ><i style="width:${barWidth(100 * doneCount / (steps.length || 1))}"></i></span>
        <span class="lbl">${esc(saveNote())}</span>
      </div>
      <p class="hint">Work top to bottom, tick as you go.</p>
      <div class="steps">${steps.map((s, i) => stepHTML(w, i, s)).join("")}</div>
      ${doneCount === steps.length && steps.length && st !== "done" ? `<p class="markdone"><button class="go" id="markdone">All steps done — mark Week ${Number(w)} complete ✓</button></p>` : ""}`
    : `<div class="locked"><b style="color:var(--ink)">This week unlocks when you reach it.</b><br>Say <code>start week ${Number(w)}</code> to Claude in chat — the full lesson, exercises, drills and this week's quiz get generated and appear right here (and in your curriculum folder). One week at a time keeps the content matched to your actual level.</div>`}
  `;
  $(".back", host).addEventListener("click", renderRoadmap);
  const pill = $("[data-pill]", host);
  const cycle = e => {
    e.preventDefault();
    const cur = S.status[w] || "todo";
    S.status[w] = STATUSES[(STATUSES.indexOf(cur) + 1) % 3];
    save(); renderWeek(w); renderProgress(); renderNow();
  };
  pill.addEventListener("click", cycle);
  pill.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") cycle(e); });
  host.querySelectorAll("[data-task]").forEach(cb => cb.addEventListener("change", () => {
    S.tasks[cb.dataset.task] = cb.checked;
    save(); renderWeek(w); renderProgress(); renderNow();
  }));
  host.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b.dataset.copy);
    b.textContent = "copied ✓"; setTimeout(() => { b.textContent = "copy"; }, 2000);
  }));
  host.querySelectorAll("[data-openquiz]").forEach(b => b.addEventListener("click", () => openQuiz(b.dataset.openquiz)));
  host.querySelectorAll("[data-openlesson]").forEach(b => b.addEventListener("click", () => renderLesson(w, b.dataset.openlesson)));
  const md = $("#markdone", host);
  if (md) md.addEventListener("click", () => { S.status[w] = "done"; save(); renderRoadmap(); renderProgress(); renderNow(); });
  window.scrollTo(0, 0);
}

/* ---------------- progress math ---------------- */
/* A week counts 1.0 when complete, else part-credit for the steps ticked — so the
   bar moves every time Sid ticks something, not once a week. */
function weekFraction(w) {
  const st = S.status[w] || "todo";
  if (st === "done") return 1;
  const steps = CONTENT[w] ? CONTENT[w].steps : null;
  if (steps && steps.length) {
    const frac = steps.filter((_, i) => S.tasks[w + ":" + i]).length / steps.length;
    return st === "doing" ? Math.max(frac, 0.05) : frac;
  }
  return st === "doing" ? 0.15 : 0;
}
function programPct() {
  const ws = Object.keys(WEEKS).map(Number);
  const sum = ws.reduce((a, w) => a + weekFraction(w), 0);
  return {
    pct: Math.round(1000 * sum / ws.length) / 10,
    weeks: ws.length,
    done: ws.filter(w => (S.status[w] || "todo") === "done").length
  };
}
const fmtPct = p => (p > 0 && p < 10 ? p.toFixed(1) : String(Math.round(p))) + "%";
function barWidth(p) { return (p > 0 ? Math.max(p, 1.5) : 0) + "%"; }

function renderTop() {
  const fill = document.getElementById("tb-fill");
  if (!fill) return;
  const p = programPct();
  fill.style.width = barWidth(p.pct);
  document.getElementById("tb-bar").setAttribute("aria-valuenow", String(Math.round(p.pct)));
  document.getElementById("tb-pct").textContent = fmtPct(p.pct);
  const order = Object.keys(WEEKS).map(Number).sort((a, b) => a - b);
  const cur = order.find(x => (S.status[x] || "todo") !== "done");
  const steps = (cur != null && CONTENT[cur]) ? CONTENT[cur].steps : [];
  const dc = steps.filter((_, i) => S.tasks[cur + ":" + i]).length;
  document.getElementById("tb-sub").textContent =
    `${p.done} of ${p.weeks} weeks complete` +
    (steps.length ? ` · Week ${cur}: ${dc}/${steps.length} steps` : "") +
    ` · finish line Feb 7, 2027`;
}
function renderAll() { renderRoadmap(); renderQuizList(); renderProgress(); renderNow(); }

function renderNow() {
  renderTop();
  const el = document.getElementById("now");
  const order = Object.keys(WEEKS).map(Number).sort((a, b) => a - b);
  const w = order.find(x => (S.status[x] || "todo") !== "done");
  if (w == null) {
    el.innerHTML = `<span class="tag">DONE</span><div><b>All 25 weeks complete.</b> <span>Tell Claude — time to apply everywhere.</span></div>`;
    return;
  }
  const steps = CONTENT[w] ? CONTENT[w].steps : [];
  const doneCount = steps.filter((_, i) => S.tasks[w + ":" + i]).length;
  const nextIdx = steps.findIndex((_, i) => !S.tasks[w + ":" + i]);
  const next = nextIdx >= 0 ? steps[nextIdx] : null;
  el.innerHTML = `<span class="tag">NOW</span>
    <div style="flex:1"><b>Week ${w} — ${esc(WEEKS[w].t)}</b> <span>· ${esc(WEEKS[w].d)}${steps.length ? ` · ${doneCount}/${steps.length} steps` : ""}${next ? ` · next: ${esc(next.t)}` : ""}</span></div>
    <button class="go" id="now-open">Open Week ${w} →</button>`;
  document.getElementById("now-open").addEventListener("click", () => openWeek(w));
}

function renderRunner(id) {

  const host = $("#view-quizzes");
  host.innerHTML = `
    <div class="runner-head">
      <button class="back">&larr; All quizzes</button>
      <h2>${esc(quiz.name)}</h2>
    </div>
    <p class="hint">Closed book. Pick one answer per question, then submit at the bottom.</p>
    <div id="result-slot"></div>
    <div id="qlist">${quiz.qs.map((item, i) => `
      <div class="qbox" data-q="${i}">
        ${item.sec ? `<div class="qsec">${esc(item.sec)}</div>` : ""}
        <p class="qtext"><span class="qn">${String(i + 1).padStart(2, "0")}</span>${esc(item.q)}</p>
        ${item.o.map((opt, j) => `

}

function grade(quiz) {
  const host = $("#view-quizzes");
  const boxes = host.querySelectorAll(".qbox");
  const answers = [];
  let missing = -1;
  boxes.forEach((box, i) => {
    const sel = box.querySelector("input:checked");
    answers[i] = sel ? Number(sel.value) : null;
    if (sel === null || !sel) { if (missing < 0) missing = i; }
  });
  const unanswered = answers.filter(a => a === null).length;
  if (unanswered > 0) {
    $("#note", host).textContent = unanswered + " question" + (unanswered > 1 ? "s" : "") + " unanswered";
    boxes[missing].scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  let score = 0;
  const bySec = {};
  const missed = [];                     // question numbers Sid got wrong — precise reinforcement beats section averages
  boxes.forEach((box, i) => {
    const item = quiz.qs[i];
    const picked = answers[i];
    const right = picked === item.a;
    if (right) score++; else missed.push((i + 1) + (item.sec ? " " + item.sec : ""));
    if (item.sec) {
      bySec[item.sec] = bySec[item.sec] || { ok: 0, n: 0 };
      bySec[item.sec].n++;
      if (right) bySec[item.sec].ok++;
    }
    box.classList.add("graded");
    const opts = box.querySelectorAll(".opt");
    opts.forEach((o, j) => {
      o.querySelector("input").disabled = true;
      if (j === item.a) o.classList.add("right");
      else if (j === picked) o.classList.add("wrong");
    });
    box.querySelector(".expl").textContent = item.x;
  });

  const total = quiz.qs.length;
  const pct = Math.round(100 * score / total);
  const prev = S.quiz[quiz.id];
  if (!prev || pct >= prev.pct) {
    S.quiz[quiz.id] = { score, total, pct, date: new Date().toISOString().slice(0, 10), missed,
      sections: quiz.sections ? Object.fromEntries(Object.entries(bySec).map(([k, v]) => [k, v.ok + "/" + v.n])) : undefined };
    save();
  }
  const verdict = pct >= 85 ? "Strong — this area won't slow you down." :
    pct >= 65 ? "Solid base — we'll reinforce the gaps in the weekly plan." :
    "Good data — this is exactly what the plan will fix. No judgment, just a starting line.";
  $("#result-slot", host).innerHTML = `<div class="result">
    <div class="big">${score}/${total} <small style="font-size:16px;color:var(--muted)">(${pct}%)</small></div>
    <div class="verdict">${verdict}</div>
    ${quiz.sections ? Object.entries(bySec).map(([k, v]) =>
      `<div class="secline"><span>${esc(k)}</span><span class="mono">${v.ok}/${v.n}</span></div>`).join("") : ""}
    ${quiz.sections ? `<p class="hint" style="margin-top:12px">Send these section scores to Claude in chat — they calibrate your whole plan.</p>` : ""}
    <button class="go" style="margin-top:8px" id="retake">Retake</button>
  </div>`;
  $("#retake", host).addEventListener("click", () => renderRunner(quiz.id));
  $("#result-slot", host).scrollIntoView({ behavior: "smooth", block: "start" });
  $("#note", host).textContent = "";
  renderProgress(); renderNow();
}

/* ---------------- progress ---------------- */

  const done = Object.values(S.status).filter(v => v === "done").length;
  const quizzes = Object.values(S.quiz);
  const avg = quizzes.length ? Math.round(quizzes.reduce((a, q) => a + q.pct, 0) / quizzes.length) : null;

  const p = programPct();
  host.innerHTML = `
    <div class="bigbar">
      <div class="head">
        <span><span class="n">${fmtPct(p.pct)}</span> <span class="hint" style="margin:0">of the 25-week program</span></span>
        <span class="hint" style="margin:0">Aug 21, 2026 → Feb 7, 2027</span>
      </div>
      <span class="bar" role="progressbar" aria-label="Overall program progress" aria-valuemin="0"
        aria-valuemax="100" aria-valuenow="${Math.round(p.pct)}"><i style="width:${barWidth(p.pct)}"></i></span>
      <p class="hint">Finished weeks plus part-credit for the steps ticked in the week you're on · ${esc(saveNote())}</p>
    </div>

    <h2 class="sec-h">Phases</h2>
    <div>${PHASES.map(ph => {
      const frac = 100 * ph.weeks.reduce((a, w) => a + weekFraction(w), 0) / ph.weeks.length;
      return `<div class="prow">
        <span class="pc">${ph.code}</span>
        <span class="pn">${esc(ph.name)}</span>
        <span class="bar" role="progressbar" aria-label="${esc(ph.name)} progress" aria-valuemin="0"
          aria-valuemax="100" aria-valuenow="${Math.round(frac)}"><i style="width:${barWidth(frac)}"></i></span>
        <span class="pct">${Math.round(frac)}%</span>
      </div>`;
    }).join("")}</div>

    <h2 class="sec-h">Counters</h2>
    <div class="tiles">
      <div class="tile">
        <div class="lbl">Weeks complete</div>
        <div class="val">${done}<small> / ${totalWeeks}</small></div>
        <div class="meter"><i style="width:${100 * done / totalWeeks}%"></i></div>
      </div>
      <div class="tile">
        <div class="lbl">Quiz average</div>
        <div class="val">${avg === null ? "—" : avg + "<small>%</small>"}</div>
        <div class="hint">${quizzes.length} quiz${quizzes.length === 1 ? "" : "zes"} taken (best scores)</div>
      </div>
      <div class="tile">
        <div class="lbl">DSA problems solved</div>
        <div class="val">${S.dsa}<small> / 50</small>
          <span class="stepper"><button id="dsa-minus" aria-label="decrease">−</button><button id="dsa-plus" aria-label="increase">+</button></span>
        </div>
        <div class="meter"><i style="width:${Math.min(100, 100 * S.dsa / 50)}%"></i></div>
      </div>
    </div>

    <h2 class="sec-h">Milestones</h2>
    <div class="mlist">${MILESTONES.map(m => {
      const reached = (S.status[m.wk] === "done");
      return `<div class="mrow">
        <span class="d">${esc(m.d)}</span>
        <span class="n">${esc(m.n)}</span>
        <span class="chip ${reached ? "ok" : "dim"}">${reached ? "Reached" : "Ahead"}</span>
      </div>`; }).join("")}
    </div>

    <h2 class="sec-h">Report to Claude</h2>
    <p class="hint">Copy this and paste it in chat with <code>status</code> or <code>grade week N</code> — it syncs your platform progress into the grade book.</p>
    <textarea class="export" readonly id="export"></textarea>
    <p><button class="copy" id="copy">Copy report</button> <span class="hint" id="copied"></span></p>`;

  $("#export", host).value = JSON.stringify({ exported: new Date().toISOString().slice(0, 10),
    program_pct: p.pct, saved: mode, rev: S.rev,
    weeks: S.status, steps_ticked: S.tasks, quizzes: S.quiz, dsa_solved: S.dsa }, null, 2);
  $("#dsa-plus", host).addEventListener("click", () => { S.dsa++; save(); renderProgress(); });
  $("#dsa-minus", host).addEventListener("click", () => { S.dsa = Math.max(0, S.dsa - 1); save(); renderProgress(); });
  $("#copy", host).addEventListener("click", () => {
    const ta = $("#export", host);
    const doneMsg = () => { $("#copied", host).textContent = "Copied — paste it to Claude in chat."; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(doneMsg, () => { ta.select(); document.execCommand("copy"); doneMsg(); });
    } else { ta.select(); document.execCommand("copy"); doneMsg(); }
  });
}

/* ---------------- nav ---------------- */
document.getElementById("nav").addEventListener("click", e => {
  const btn = e.target.closest("button[data-v]");
  if (!btn) return;
  showView(btn.dataset.v);
  if (btn.dataset.v === "roadmap") renderRoadmap();
  if (btn.dataset.v === "quizzes" && !$("#view-quizzes .qbox")) renderQuizList();
  if (btn.dataset.v === "progress") renderProgress();   // always fresh: it reads live counters
});

renderRoadmap();
renderQuizList();
renderProgress();
renderNow();
</script>
